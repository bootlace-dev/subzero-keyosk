version: '3.8'

services:
  bitcoind:
    image: ruimarinho/bitcoin-core:28.0
    container_name: subzero-regtest
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - regtest_data:/home/bitcoin/.bitcoin
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=subzero
      - -rpcpassword=keygenpass
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.0001
      - -maxtxfee=0.1
      - -txindex=1

volumes:
  regtest_data:
