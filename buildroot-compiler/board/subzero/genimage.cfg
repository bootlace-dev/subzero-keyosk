image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"bootcode.bin",
			"cmdline.txt",
			"config.txt",
			"fixup.dat",
			"start4.elf",
			"Image"
		}
	}
	size = 48M
}

image subzero.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
