name: SubZero CI & Cryptographic Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  audit-and-test:
    name: BIP Vectors & Cryptographic Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Testnet4 TUI Bundle
        run: |
          export SOURCE_DATE_EPOCH=1700000000
          export TZ=UTC
          npm run build:testnet4

      - name: Run Full Vitest Suite
        run: npx vitest run

  build-testnet4-images:
    name: Deterministic Live Testnet4 Multi-Arch Builder
    runs-on: ubuntu-latest
    needs: audit-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Bundles (Vault & TUI)
        run: |
          export SOURCE_DATE_EPOCH=1700000000
          export TZ=UTC
          npm run build:all

      - name: Build Containerized Alpine PC Image (x86_64 PC / Dell Chromebook)
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_alpine_containerized.sh fb_vault.cjs subzero-vault-pc.img

      - name: Build Containerized Raspberry Pi Image (armv7 / arm64)
        run: |
          ./scripts/build_rpi_containerized.sh fb_vault.cjs subzero-vault-rpi.img

      - name: Compress Release Packages & Generate Checksums
        run: |
          cd dist
          zip -9 -j subzero-vault-pc.img.zip subzero-vault-pc.img
          zip -9 -j subzero-vault-rpi.img.zip subzero-vault-rpi.img
          sha256sum subzero-vault-pc.img subzero-vault-rpi.img subzero-vault-pc.img.zip subzero-vault-rpi.img.zip fb_vault.cjs decrypt.html > SHA256SUMS.txt
          cat SHA256SUMS.txt

          PC_ZIP_HASH=$(sha256sum subzero-vault-pc.img.zip | awk '{print $1}')
          RPI_ZIP_HASH=$(sha256sum subzero-vault-rpi.img.zip | awk '{print $1}')
          VAULT_HASH=$(sha256sum fb_vault.cjs | awk '{print $1}')

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🛡️ SubZero Keyosk Dual-Partition Build Digest & Checksums

          ### 🔒 Deterministic Cryptographic Core
          | Artifact | Architecture | Universal SHA-256 |
          | :--- | :--- | :--- |
          | **\`fb_vault.cjs\`** | Standalone Linux Framebuffer (/dev/fb0) | \`${VAULT_HASH}\` |

          ### 📦 Live Bootable Delivery Packages
          | Release Package | Target Hardware | SHA-256 (Compressed .zip) |
          | :--- | :--- | :--- |
          | **\`subzero-vault-pc.img.zip\`** | x86_64 PC / Dell Chromebook (UEFI/BIOS) | \`${PC_ZIP_HASH}\` |
          | **\`subzero-vault-rpi.img.zip\`** | Raspberry Pi 2/3/4/5 / Zero 2W | \`${RPI_ZIP_HASH}\` |
          EOF

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: subzero-vault-release-images
          path: |
            dist/subzero-vault-pc.img.zip
            dist/subzero-vault-rpi.img.zip
            dist/fb_vault.cjs
            dist/decrypt.html
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Pre-Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/subzero-vault-pc.img.zip
            dist/subzero-vault-rpi.img.zip
            dist/fb_vault.cjs
            dist/decrypt.html
            dist/SHA256SUMS.txt
            bootlace-dev-release.asc
          draft: false
          prerelease: true
          generate_release_notes: true

