name: SubZero CI & Cryptographic Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  audit-and-test:
    name: BIP Vectors & Cryptographic Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Testnet4 TUI Bundle
        run: |
          export SOURCE_DATE_EPOCH=1700000000
          export TZ=UTC
          npm run build:testnet4

      - name: Run Full Vitest Suite
        run: npx vitest run

  build-testnet4-images:
    name: Deterministic Live Testnet4 Multi-Arch Builder
    runs-on: ubuntu-latest
    needs: audit-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Single-Binary Testnet4 TUI Bundle
        run: |
          export SOURCE_DATE_EPOCH=1700000000
          export TZ=UTC
          npm run build:testnet4

      - name: Build Containerized Alpine Testnet4 Image (x86_64 PC)
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_alpine_containerized.sh tui_testnet4.cjs subzero-testnet4-pc.img

      - name: Build Containerized Raspberry Pi Testnet4 Image (armv7 / arm64)
        run: |
          ./scripts/build_rpi_containerized.sh tui_testnet4.cjs subzero-testnet4-rpi.img

      - name: Compress Release Packages & Generate Checksums
        run: |
          cd dist
          zip -9 -j subzero-testnet4-pc.img.zip subzero-testnet4-pc.img
          zip -9 -j subzero-testnet4-rpi.img.zip subzero-testnet4-rpi.img
          sha256sum subzero-testnet4-pc.img subzero-testnet4-rpi.img subzero-testnet4-pc.img.zip subzero-testnet4-rpi.img.zip tui_testnet4.cjs > SHA256SUMS.txt
          cat SHA256SUMS.txt

          PC_ZIP_HASH=$(sha256sum subzero-testnet4-pc.img.zip | awk '{print $1}')
          RPI_ZIP_HASH=$(sha256sum subzero-testnet4-rpi.img.zip | awk '{print $1}')
          TUI_HASH=$(sha256sum tui_testnet4.cjs | awk '{print $1}')

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🛡️ SubZero Keyosk Testnet4 Build Digest & Checksums

          ### 🔒 Deterministic Cryptographic Core
          | Artifact | Architecture | Universal SHA-256 |
          | :--- | :--- | :--- |
          | **\`tui_testnet4.cjs\`** | Standalone Node.js (All Platforms) | \`${TUI_HASH}\` |

          ### 📦 Live Bootable Delivery Packages
          | Release Package | Target Hardware | SHA-256 (Compressed .zip) |
          | :--- | :--- | :--- |
          | **\`subzero-testnet4-pc.img.zip\`** | x86_64 PC / Laptop (UEFI/BIOS) | \`${PC_ZIP_HASH}\` |
          | **\`subzero-testnet4-rpi.img.zip\`** | Raspberry Pi 5, 4B, 400, 3B+, Zero 2 W | \`${RPI_ZIP_HASH}\` |
          EOF

      - name: Upload Testnet4 Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: subzero-testnet4-release-images
          path: |
            dist/subzero-testnet4-pc.img.zip
            dist/subzero-testnet4-rpi.img.zip
            dist/tui_testnet4.cjs
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Pre-Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/subzero-testnet4-pc.img.zip
            dist/subzero-testnet4-rpi.img.zip
            dist/tui_testnet4.cjs
            dist/SHA256SUMS.txt
            bootlace-dev-release.asc
          draft: false
          prerelease: true
          generate_release_notes: true

